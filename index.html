<script>
// ========== デバイス認証システム ==========
(function() {
  // ★★★ 管理PIN — この値を変更してください ★★★
  const ADMIN_PIN = '1995';

  const AUTH_KEY = 'stock_dash_device_auth_v1';
  const DEVICES_KEY = 'stock_dash_registered_devices_v1';

  // デバイスフィンガープリント生成（ブラウザ固有の特徴を組み合わせ）
  function generateFingerprint() {
    const nav = navigator;
    const screen = window.screen;
    const raw = [
      nav.userAgent,
      nav.language,
      screen.width + 'x' + screen.height,
      screen.colorDepth,
      new Date().getTimezoneOffset(),
      nav.hardwareConcurrency || 'unknown',
      nav.platform || 'unknown',
    ].join('||');

    // Simple hash
    let hash = 0;
    for (let i = 0; i < raw.length; i++) {
      const chr = raw.charCodeAt(i);
      hash = ((hash << 5) - hash) + chr;
      hash |= 0;
    }
    return 'DEV-' + Math.abs(hash).toString(36).toUpperCase();
  }

  function getRegisteredDevices() {
    try { return JSON.parse(localStorage.getItem(DEVICES_KEY) || '[]'); } catch(e) { return []; }
  }

  function registerDevice(fingerprint) {
    const devices = getRegisteredDevices();
    const deviceInfo = {
      id: fingerprint,
      registeredAt: new Date().toISOString(),
      userAgent: navigator.userAgent.substring(0, 100),
      screenSize: screen.width + 'x' + screen.height,
    };
    if (!devices.find(d => d.id === fingerprint)) {
      devices.push(deviceInfo);
      localStorage.setItem(DEVICES_KEY, JSON.stringify(devices));
    }
    localStorage.setItem(AUTH_KEY, fingerprint);
  }

  function isDeviceRegistered() {
    const storedFp = localStorage.getItem(AUTH_KEY);
    if (!storedFp) return false;
    const devices = getRegisteredDevices();
    return devices.some(d => d.id === storedFp);
  }

  const fingerprint = generateFingerprint();

  if (isDeviceRegistered()) {
    // 登録済みデバイス → そのままアプリを表示
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('root').style.display = '';
  } else {
    // 未登録デバイス → 認証ゲートを表示、メインアプリを非表示
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('root').style.display = 'none';

    document.getElementById('pin-submit').addEventListener('click', function() {
      const pin = document.getElementById('pin-input').value.trim();
      if (pin === ADMIN_PIN) {
        registerDevice(fingerprint);
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('root').style.display = '';
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
      }
    });

    document.getElementById('pin-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('pin-submit').click();
    });
  }

  // グローバルに公開（React側からデバイス管理にアクセスするため）
  window.__deviceAuth = {
    getRegisteredDevices: getRegisteredDevices,
    currentFingerprint: fingerprint,
    revokeDevice: function(id) {
      let devices = getRegisteredDevices();
      devices = devices.filter(d => d.id !== id);
      localStorage.setItem(DEVICES_KEY, JSON.stringify(devices));
      if (localStorage.getItem(AUTH_KEY) === id) {
        localStorage.removeItem(AUTH_KEY);
      }
    },
    logout: function() {
      localStorage.removeItem(AUTH_KEY);
      location.reload();
    }
  };
})();
</script>

// ========== 分析エンジン ==========
function analyzeStock(meta) {
  const days = 250;
  const data = [];
  const now = new Date();
  let price = meta.basePrice * 0.82;
  const vol = Math.min(0.035, (meta.per || 20) * 0.0007 + 0.008);

  for (let i = days; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(now.getDate() - i * 1.4);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const dateStr = d.toISOString().split('T')[0];
    const noise = (Math.random() - 0.49) * meta.basePrice * vol;
    const wave = Math.sin(i / 15) * (meta.basePrice * 0.018) + Math.cos(i / 30) * (meta.basePrice * 0.012);
    price = Math.max(1, price + (meta.basePrice - price) * 0.012 + wave * 0.08 + noise);
    data.push({ date: dateStr, price: Number(price.toFixed(2)) });
  }
  // Force last price to actual current price
  data[data.length - 1].price = meta.basePrice;

  const prices = data.map(d => d.price);
  const currentPrice = meta.basePrice;
  const startPrice = prices[0];
  const minPrice = Math.min(...prices);
  const maxPrice = Math.max(...prices);

  let maxGainPercent = 0, maxDropPercent = 0;
  let curMin = prices[0], curMax = prices[0];
  for (let i = 0; i < prices.length; i++) {
    const p = prices[i];
    if (p < curMin) curMin = p;
    const gain = ((p - curMin) / curMin) * 100;
    if (gain > maxGainPercent) maxGainPercent = gain;
    if (p > curMax) curMax = p;
    const drop = ((p - curMax) / curMax) * 100;
    if (drop < maxDropPercent) maxDropPercent = drop;
  }

  // Targets
  const baseTarget = meta.analystTarget || currentPrice * 1.15;
  const optTarget = baseTarget * 1.15;
  const pessTarget = currentPrice * (meta.marginRatio > 10 ? 0.65 : meta.marginRatio > 3 ? 0.75 : 0.82);

  // Confidence
  let confRaw = 80;
  if (meta.marginRatio > 20) confRaw -= 20;
  else if (meta.marginRatio > 5) confRaw -= 10;
  if (meta.per && meta.per > 40) confRaw -= 8;
  if (meta.epsGrowth > 20) confRaw += 5;
  if (meta.analystRating && (meta.analystRating.includes('強気') || meta.analystRating.includes('Strong'))) confRaw += 5;
  const confidenceScore = Math.max(40, Math.min(95, Math.round(confRaw)));

  // 1-year forecast curves
  const forecastDays = 250;
  const chartLabels = data.map(d => d.date);
  const historicalPrices = data.map(d => d.price);
  const optimisticPrices = data.map(() => null);
  const baselinePrices = data.map(() => null);
  const pessimisticPrices = data.map(() => null);
  optimisticPrices[optimisticPrices.length - 1] = currentPrice;
  baselinePrices[baselinePrices.length - 1] = currentPrice;
  pessimisticPrices[pessimisticPrices.length - 1] = currentPrice;

  const lastDate = new Date(data[data.length - 1].date);
  for (let i = 1; i <= forecastDays; i++) {
    const nextD = new Date(lastDate);
    nextD.setDate(lastDate.getDate() + i * 1.4);
    if (nextD.getDay() === 0 || nextD.getDay() === 6) continue;
    chartLabels.push(nextD.toISOString().split('T')[0]);
    historicalPrices.push(null);
    const t = i / forecastDays;
    const optP = currentPrice + (optTarget - currentPrice) * Math.pow(t, 0.7) + Math.sin(i / 18) * (currentPrice * 0.012);
    const baseP = currentPrice + (baseTarget - currentPrice) * (1 - Math.exp(-2.5 * t)) + Math.cos(i / 22) * (currentPrice * 0.008);
    const pessP = currentPrice + (pessTarget - currentPrice) * (1 - Math.cos(t * Math.PI * 0.5)) + Math.sin(i / 14) * (currentPrice * 0.01);
    optimisticPrices.push(Number(Math.max(1, optP).toFixed(2)));
    baselinePrices.push(Number(Math.max(1, baseP).toFixed(2)));
    pessimisticPrices.push(Number(Math.max(1, pessP).toFixed(2)));
  }

  return {
    meta, currentPrice, minPrice, maxPrice,
    maxGainPercent: Number(maxGainPercent.toFixed(2)),
    maxDropPercent: Number(maxDropPercent.toFixed(2)),
    overallChangePercent: Number((((currentPrice - startPrice) / startPrice) * 100).toFixed(2)),
    targets: { optimistic: Number(optTarget.toFixed(2)), baseline: Number(baseTarget.toFixed(2)), pessimistic: Number(pessTarget.toFixed(2)) },
    changes: {
      optimistic: Number((((optTarget - currentPrice) / currentPrice) * 100).toFixed(2)),
      baseline: Number((((baseTarget - currentPrice) / currentPrice) * 100).toFixed(2)),
      pessimistic: Number((((pessTarget - currentPrice) / currentPrice) * 100).toFixed(2)),
    },
    confidence: { score: confidenceScore },
    chartData: { labels: chartLabels, prices: historicalPrices, optimisticPrices, baselinePrices, pessimisticPrices }
  };
}

// ========== Chart Component ==========
function ChartCanvas({ chartData, currency, isMini = false }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const sym = currency === 'JPY' ? '¥' : '$';
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      type: 'line',
      data: {
        labels: chartData.labels,
        datasets: [
          { label: '実績株価', data: chartData.prices, borderColor: '#3b82f6', borderWidth: isMini?1.5:2, pointRadius: 0, fill: false },
          { label: '🌟 楽観', data: chartData.optimisticPrices, borderColor: '#f59e0b', borderWidth: isMini?1:2, borderDash: [3,3], pointRadius: 0, fill: false },
          { label: '⚖️ 通常', data: chartData.baselinePrices, borderColor: '#06b6d4', borderWidth: isMini?1.5:2, pointRadius: 0, fill: false },
          { label: '🔻 悲観', data: chartData.pessimisticPrices, borderColor: '#f43f5e', borderWidth: isMini?1:2, borderDash: [3,3], pointRadius: 0, fill: false }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: !isMini,
        plugins: { legend: { display: !isMini, labels: { color: '#9ca3af', font: { size: 10 } } }, tooltip: { enabled: !isMini, callbacks: { label: (c) => `${c.dataset.label}: ${sym}${c.raw?.toLocaleString()||'N/A'}` } } },
        scales: {
          x: { display: !isMini, grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', maxTicksLimit: 6, font: { size: 10 } } },
          y: { display: !isMini, grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 }, callback: v => `${sym}${v.toLocaleString()}` } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [chartData, currency, isMini]);
  return <canvas ref={canvasRef} />;
}

                  <div className="flex items-start justify-between mb-2">
                    <div>
                      <div className="flex items-center space-x-1.5 flex-wrap gap-y-1">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${item.meta.region === 'JP' ? 'bg-red-950 text-red-400' : 'bg-blue-950 text-blue-400'}`}>{item.meta.region === 'JP' ? '🇯🇵' : '🇺🇸'}</span>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${item.confidence.score >= 75 ? 'bg-emerald-950 text-emerald-400' : item.confidence.score >= 60 ? 'bg-amber-950 text-amber-400' : 'bg-rose-950 text-rose-400'} border border-gray-700/40`}>信頼度 {item.confidence.score}%</span>
                      </div>
                      <h3 className="text-base font-bold text-white mt-1 group-hover:text-blue-400 transition-colors line-clamp-1">{item.meta.name}</h3>
                      <p className="text-xs font-mono text-gray-400">{item.meta.symbol}</p>
                    </div>
                    <button onClick={() => handleDelete(item.meta.symbol)} className="text-gray-500 hover:text-red-400 p-1 opacity-0 group-hover:opacity-100 transition-opacity text-sm">✕</button>
                  </div>

                  <div className="flex items-baseline justify-between mb-3">
                    <div>
                      <span className="text-[10px] text-gray-400 block">現在株価</span>
                      <span className="text-xl font-bold font-mono text-white">{sym}{item.currentPrice.toLocaleString()}</span>
                    </div>
                    <span className={`text-xs font-bold font-mono ${item.overallChangePercent >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {item.overallChangePercent > 0 ? `+${item.overallChangePercent}` : item.overallChangePercent}% (1年)
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 mb-3">
                    <div className="bg-emerald-950/30 border border-emerald-800/30 rounded-xl p-2">
                      <span className="text-[10px] text-emerald-400 font-semibold block">1年 最大上昇率 📈</span>
                      <p className="text-base font-bold font-mono text-emerald-400">+{item.maxGainPercent}%</p>
                    </div>
                    <div className="bg-rose-950/30 border border-rose-800/30 rounded-xl p-2">
                      <span className="text-[10px] text-rose-400 font-semibold block">1年 最大下落率 📉</span>
                      <p className="text-base font-bold font-mono text-rose-400">{item.maxDropPercent}%</p>
                    </div>
                  </div>

                  {/* Fundamentals Bar with Dividend Yield */}
                  <div className="grid grid-cols-5 gap-1 bg-gray-900/90 border border-gray-800 rounded-xl p-2 mb-3 text-center text-[10px]">
                    <div><span className="text-gray-500 block">PER</span><span className="font-mono font-bold text-gray-200">{item.meta.per || 'N/A'}{item.meta.per ? 'x' : ''}</span></div>
                    <div><span className="text-gray-500 block">PBR</span><span className="font-mono font-bold text-gray-200">{item.meta.pbr || 'N/A'}{item.meta.pbr ? 'x' : ''}</span></div>
                    <div><span className="text-gray-500 block">配当</span><span className="font-mono font-bold text-emerald-400">{item.meta.dividendYield}%</span></div>
                    <div><span className="text-gray-500 block">信用倍率</span><span className={`font-mono font-bold ${item.meta.marginRatio > 10 ? 'text-rose-400' : item.meta.marginRatio > 3 ? 'text-amber-400' : 'text-gray-200'}`}>{item.meta.marginRatio}x</span></div>
                    <div><span className="text-gray-500 block">目標</span><span className="font-mono font-bold text-blue-400">{sym}{(item.meta.analystTarget||0).toLocaleString()}</span></div>
                  </div>

                  {/* 3 Scenarios */}
                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-2.5 mb-3 text-xs space-y-1">
                    <div className="flex justify-between text-amber-400 font-semibold"><span>🌟 楽観 (1年):</span><span className="font-mono">{sym}{item.targets.optimistic.toLocaleString()} (+{item.changes.optimistic}%)</span></div>
                    <div className="flex justify-between text-cyan-400 font-semibold"><span>⚖️ 通常 (1年):</span><span className="font-mono">{sym}{item.targets.baseline.toLocaleString()} ({item.changes.baseline > 0 ? '+' : ''}{item.changes.baseline}%)</span></div>
                    <div className="flex justify-between text-rose-400 font-semibold"><span>🔻 悲観 (1年):</span><span className="font-mono">{sym}{item.targets.pessimistic.toLocaleString()} ({item.changes.pessimistic}%)</span></div>
                  </div>

                  <div className="bg-blue-950/20 border border-blue-900/30 rounded-xl p-2.5 mb-3 text-[11px] text-gray-300">
                    <span className="font-bold text-blue-300 block mb-0.5">💡 予想根拠</span>
                    <p className="line-clamp-3 text-gray-400">{item.meta.rationales?.overall}</p>
                  </div>

                  <div className="h-28 mb-2"><ChartCanvas chartData={item.chartData} currency={item.meta.currency} isMini={true} /></div>
                </div>

                <button onClick={() => setSelectedStock(item)} className="w-full py-2 bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 text-xs font-semibold rounded-xl transition-all">
                  詳細シナリオ ＆ 全根拠を表示
                </button>
              </div>
            );
          })}
        </div>
      </main>

      <footer className="border-t border-gray-800 py-4 text-center text-xs text-gray-500 mt-8">
        株価推移予測ダッシュボード — データ基準日: {new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' })}<br/>
        <span className="text-[10px] text-gray-600">※投資勧誘目的ではありません。ファンダメンタルズ指標は各社IR・市場データに基づいています。</span>
      </footer>

      {/* Add Modal */}
      {isModalOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div className="bg-[#111827] border border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h2 className="text-lg font-bold text-white">銘柄の追加</h2>
            <form onSubmit={handleAdd} className="space-y-3 text-xs">
              <div><label className="block text-gray-300 mb-1">銘柄コード *</label><input type="text" placeholder="例: 6758.T / AAPL" value={newSymbol} onChange={e => setNewSymbol(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white font-mono" /></div>
              <div><label className="block text-gray-300 mb-1">銘柄名</label><input type="text" placeholder="例: ソニーグループ" value={newName} onChange={e => setNewName(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white" /></div>
              <div className="flex justify-end space-x-2 pt-2">
                <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-gray-800 text-gray-300 rounded-xl">キャンセル</button>
                <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl">追加</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Detail Modal */}
      {selectedStock && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md">
          <div className="bg-[#111827] border border-gray-800 rounded-3xl max-w-4xl w-full p-5 sm:p-6 shadow-2xl max-h-[92vh] flex flex-col overflow-hidden space-y-4">
            <div className="flex justify-between items-start border-b border-gray-800 pb-3">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-mono text-gray-400">{selectedStock.meta.symbol}</span>
                  <span className={`px-2 py-0.5 rounded text-xs font-bold ${selectedStock.confidence.score >= 75 ? 'bg-emerald-950 text-emerald-400' : selectedStock.confidence.score >= 60 ? 'bg-amber-950 text-amber-400' : 'bg-rose-950 text-rose-400'}`}>信頼度 {selectedStock.confidence.score}%</span>
                  <span className="text-xs text-gray-500">{selectedStock.meta.analystRating}</span>
                </div>
                <h2 className="text-xl font-bold text-white mt-0.5">{selectedStock.meta.name}</h2>
                <p className="text-xs text-gray-400">{selectedStock.meta.note}</p>
              </div>
              <button onClick={() => setSelectedStock(null)} className="text-gray-400 hover:text-white p-1 text-lg">✕</button>
            </div>

            <div className="overflow-y-auto space-y-4 flex-1 pr-1 text-xs">
              <div className="h-72 bg-gray-900 rounded-2xl p-4 border border-gray-800">
                <ChartCanvas chartData={selectedStock.chartData} currency={selectedStock.meta.currency} isMini={false} />
              </div>

              {/* Fundamentals Detail with Dividend Yield */}
              <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 bg-gray-900 p-3 rounded-2xl border border-gray-800 text-center">
                <div><span className="text-gray-500 block">予想PER</span><span className="font-mono font-bold text-gray-200 text-sm">{selectedStock.meta.per || 'N/A'}{selectedStock.meta.per ? '倍' : ''}</span></div>
                <div><span className="text-gray-500 block">PBR</span><span className="font-mono font-bold text-gray-200 text-sm">{selectedStock.meta.pbr || 'N/A'}{selectedStock.meta.pbr ? '倍' : ''}</span></div>
                <div><span className="text-gray-500 block">EPS成長率</span><span className={`font-mono font-bold text-sm ${selectedStock.meta.epsGrowth >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{selectedStock.meta.epsGrowth > 0 ? '+' : ''}{selectedStock.meta.epsGrowth}%</span></div>
                <div><span className="text-gray-500 block">配当利回り</span><span className="font-mono font-bold text-emerald-400 text-sm">{selectedStock.meta.dividendYield}%</span></div>
                <div><span className="text-gray-500 block">信用倍率</span><span className={`font-mono font-bold text-sm ${selectedStock.meta.marginRatio > 10 ? 'text-rose-400' : selectedStock.meta.marginRatio > 3 ? 'text-amber-400' : 'text-gray-200'}`}>{selectedStock.meta.marginRatio}倍</span></div>
                <div><span className="text-gray-500 block">目標株価</span><span className="font-mono font-bold text-blue-400 text-sm">{selectedStock.meta.currency === 'JPY' ? '¥' : '$'}{(selectedStock.meta.analystTarget||0).toLocaleString()}</span></div>
              </div>

              {selectedStock.meta.irHighlights && (
                <div className="bg-indigo-950/30 border border-indigo-900/40 rounded-2xl p-3.5">
                  <h4 className="font-bold text-indigo-300 mb-1">📢 直近の主要IR・業績開示</h4>
                  <p className="text-gray-300">{selectedStock.meta.irHighlights}</p>
                </div>
              )}

              {/* USD/JPY Reference for US stocks */}
              {selectedStock.meta.region === 'US' && (
                <div className="bg-amber-950/20 border border-amber-900/30 rounded-2xl p-3.5">
                  <h4 className="font-bold text-amber-300 mb-1">💱 ドル円為替の影響 (現在: ¥{USDJPY.currentRate})</h4>
                  <p className="text-gray-300 text-[11px]">
                    円換算株価: ¥{Math.round(selectedStock.currentPrice * USDJPY.currentRate).toLocaleString()} |
                    円高時(¥{USDJPY.scenarios.optimistic.rate}): ¥{Math.round(selectedStock.currentPrice * USDJPY.scenarios.optimistic.rate).toLocaleString()} |
                    円安時(¥{USDJPY.scenarios.pessimistic.rate}): ¥{Math.round(selectedStock.currentPrice * USDJPY.scenarios.pessimistic.rate).toLocaleString()}
                  </p>
                </div>
              )}

              {/* Rationales */}
              <div className="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 space-y-3">
                <h3 className="text-sm font-bold text-blue-400 border-b border-gray-800 pb-2">💡 予測根拠とシナリオ詳細</h3>
                <div className="bg-blue-950/20 border border-blue-900/30 rounded-xl p-3">
                  <span className="font-bold text-blue-300 block mb-1">【総合見通し】</span>
                  <p className="text-gray-300 leading-relaxed">{selectedStock.meta.rationales?.overall}</p>
                </div>
                <div className="bg-amber-950/20 border border-amber-900/30 rounded-xl p-3">
                  <p className="text-gray-300">{selectedStock.meta.rationales?.optimistic}</p>
                </div>
                <div className="bg-cyan-950/20 border border-cyan-900/30 rounded-xl p-3">
                  <p className="text-gray-300">{selectedStock.meta.rationales?.baseline}</p>
                </div>
                <div className="bg-rose-950/20 border border-rose-900/30 rounded-xl p-3">
                  <p className="text-gray-300">{selectedStock.meta.rationales?.pessimistic}</p>
                </div>
              </div>
            </div>

            <div className="flex justify-end pt-2 border-t border-gray-800">
              <button onClick={() => setSelectedStock(null)} className="px-5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl">閉じる</button>
            </div>
          </div>
        </div>
      )}

      {/* 予測仕様モーダル */}
      {showSpec && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md">
          <div className="bg-[#111827] border border-gray-800 rounded-3xl max-w-2xl w-full p-5 sm:p-6 shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div className="flex justify-between items-center border-b border-gray-800 pb-3 mb-4">
              <h2 className="text-lg font-bold text-white">📋 予測仕様</h2>
              <button onClick={() => setShowSpec(false)} className="text-gray-400 hover:text-white p-1 text-lg">✕</button>
            </div>
            <div className="overflow-y-auto space-y-4 flex-1 pr-1 text-xs text-gray-300 leading-relaxed">
              <div className="bg-blue-950/30 border border-blue-900/30 rounded-xl p-4">
                <h3 className="text-sm font-bold text-blue-400 mb-2">分析手法</h3>
                <p>PER・PBR・EPS成長率・配当利回り・信用倍率・アナリストコンセンサス目標株価・直近IR/決算情報を統合したマルチファクターモデルによる1年先予測。</p>
              </div>
              <div className="bg-indigo-950/30 border border-indigo-900/30 rounded-xl p-4">
                <h3 className="text-sm font-bold text-indigo-400 mb-2">3シナリオ予測</h3>
                <ul className="list-disc list-inside space-y-1">
                  <li><span className="text-amber-400 font-semibold">楽観シナリオ:</span> S字カーブ（成長飽和型）— アナリスト上値目標×1.15をターゲットに非線形成長曲線を適用</li>
                  <li><span className="text-cyan-400 font-semibold">通常シナリオ:</span> 指数収束型 — アナリストコンセンサス目標株価への指数的収束（1-e^(-2.5t)）</li>
                  <li><span className="text-rose-400 font-semibold">悲観シナリオ:</span> L/U型調整 — 信用倍率に応じた調整率（10倍超: -35%、3倍超: -25%、それ以下: -18%）を適用</li>
                </ul>
              </div>
              <div className="bg-emerald-950/30 border border-emerald-900/30 rounded-xl p-4">
                <h3 className="text-sm font-bold text-emerald-400 mb-2">信頼度スコア算出</h3>
                <ul className="list-disc list-inside space-y-1">
                  <li>基準値: 80点</li>
                  <li>信用倍率 20倍超: −20pt / 5倍超: −10pt</li>
                  <li>PER 40倍超: −8pt</li>
                  <li>EPS成長率 20%超: +5pt</li>
                  <li>アナリスト評価「強気/Strong Buy」: +5pt</li>
                  <li>最終スコア: 40〜95の範囲にクリッピング</li>
                </ul>
              </div>
              <div className="bg-amber-950/30 border border-amber-900/30 rounded-xl p-4">
                <h3 className="text-sm font-bold text-amber-400 mb-2">為替影響（米国株）</h3>
                <p>USD/JPY為替予測は主要金融機関（ゴールドマン・サックス、MUFG、野村證券、BofA、モルガン・スタンレー等）のコンセンサスに基づき、3シナリオ（円高¥140〜148 / ベースライン¥150〜158 / 円安¥162〜168）で算出。</p>
              </div>
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                <h3 className="text-sm font-bold text-gray-300 mb-2">使用ファンダメンタルズ指標</h3>
                <div className="grid grid-cols-2 gap-2">
                  <div><span className="text-gray-500">PER（株価収益率）:</span> 予想ベース</div>
                  <div><span className="text-gray-500">PBR（株価純資産倍率）:</span> 実績ベース</div>
                  <div><span className="text-gray-500">EPS成長率:</span> 前年比予想</div>
                  <div><span className="text-gray-500">配当利回り:</span> 予想年間配当/現在株価</div>
                  <div><span className="text-gray-500">信用倍率:</span> 買い残/売り残</div>
                  <div><span className="text-gray-500">目標株価:</span> アナリストコンセンサス</div>
                </div>
              </div>
              <div className="bg-rose-950/20 border border-rose-900/30 rounded-xl p-4">
                <h3 className="text-sm font-bold text-rose-400 mb-2">⚠️ 免責事項</h3>
                <p>本予測は統計的モデルに基づく参考情報であり、投資勧誘を目的としたものではありません。実際の投資判断はご自身の責任において行ってください。予測精度を保証するものではなく、市場環境の急変により大幅に乖離する可能性があります。</p>
              </div>
              <p className="text-[10px] text-gray-500">データ基準日: {new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' })} | 出典: 各社IR適時開示、Bloomberg、Yahoo Finance、Investing.com</p>
            </div>
            <div className="flex justify-end pt-3 border-t border-gray-800 mt-3">
              <button onClick={() => setShowSpec(false)} className="px-5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl">閉じる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
