name: Daily Stock Data Update

on:
  schedule:
    # 毎日日本時間 06:00 (UTC 21:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest stock prices and update index.html
        run: |
          node update_stocks.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "📊 Daily stock data update $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
